<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>{% block subject %}{{ site_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#F4F5F7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1A1A2E;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F4F5F7;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;background:#ffffff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.06);overflow:hidden;">
          <tr>
            <td style="background:linear-gradient(135deg,#1A1A2E,#16213E);padding:24px 28px;color:#ffffff;">
              <div style="font-size:20px;font-weight:700;letter-spacing:-0.3px;">
                Bernard <span style="color:#E6003E;">Poignant</span>
              </div>
              <div style="font-size:13px;color:rgba(255,255,255,0.7);margin-top:2px;">
                {{ site_tagline }}
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;line-height:1.6;font-size:15px;color:#1A1A2E;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background:#F4F5F7;font-size:12px;color:#6C757D;text-align:center;border-top:1px solid #e6e6e6;">
              {% block footer %}
                Vous recevez cet e-mail car vous êtes inscrit à la newsletter de
                <a href="{{ site_url }}" style="color:#E6003E;text-decoration:none;">bernardpoignant.fr</a>.
              {% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
