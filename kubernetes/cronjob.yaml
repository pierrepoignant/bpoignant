# Weekly Google scrape for "bernard poignant".
# Runs the same image as the web app, executes the standalone fetcher, and
# stores a fresh timestamped run in the google_urls / search_runs tables.
#
# Schedule: every Sunday at 00:00 (midnight) Europe/Paris.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-seo-scrape
  namespace: default
spec:
  schedule: "0 0 * * 0"          # Sunday 00:00 (midnight)
  timeZone: "Europe/Paris"        # k8s >= 1.27 honours this; image TZ is Paris too
  concurrencyPolicy: Forbid       # never let two scrapes overlap
  startingDeadlineSeconds: 3600   # if the cluster was busy, still run within the hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2             # retry a couple of times on transient API/DB errors
      activeDeadlineSeconds: 1800 # kill a stuck run after 30 min
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: seo-scrape
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "fetch_google_urls.py", "bernard poignant", "500"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets   # provides DATABASE_OVH__* and SEARCHAPI__API_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
---
# Daily X sync: engagement metrics + new replies, then the digest e-mail.
#
# Cost is flat at ~2 API calls per run however many articles exist: metrics for
# every tweet come back in one batched GET /2/tweets, and new replies across
# every conversation come from a single GET /2/users/:id/mentions with
# since_id. See tweets/__init__.py.
#
# Schedule: every day at 07:30 Europe/Paris — before Bernard's morning, and
# late enough that replies from the previous evening are all in.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-x-poll
  namespace: default
spec:
  schedule: "30 7 * * *"          # daily 07:30
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid       # never let two syncs overlap the cursor
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2             # transient 5xx / network blips
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: x-poll
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "poll_x.py"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets   # DATABASE_OVH__*, BPOIGNANT_X__*, SENDGRID__API_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
---
# Automatic daily share: post the oldest article never put on X.
#
# Posts at most one article per run, and only when nothing has gone out in the
# last 23 hours — so a manual share during the evening suppresses it, and the
# backlog drips out instead of arriving as a burst. No-op once every published
# article has been shared. See tweets.auto_post().
#
# Schedule: every day at 00:00 Europe/Paris.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-x-autopost
  namespace: default
spec:
  schedule: "0 0 * * *"           # daily midnight
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid       # two overlapping runs could double-post
  # No startingDeadlineSeconds: if the cluster was busy at midnight we would
  # rather skip the day than fire a public post at an unexpected hour.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0             # never retry a post — a retry after a
                                  # partial failure risks tweeting twice
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: x-autopost
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "auto_tweet.py"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets   # DATABASE_OVH__*, BPOIGNANT_X__*
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
