# Weekly Google scrape for "bernard poignant".
# Runs the same image as the web app, executes the standalone fetcher, and
# stores a fresh timestamped run in the google_urls / search_runs tables.
#
# Schedule: every Sunday at 00:00 (midnight) Europe/Paris.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-seo-scrape
  namespace: default
spec:
  schedule: "0 0 * * 0"          # Sunday 00:00 (midnight)
  timeZone: "Europe/Paris"        # k8s >= 1.27 honours this; image TZ is Paris too
  concurrencyPolicy: Forbid       # never let two scrapes overlap
  startingDeadlineSeconds: 3600   # if the cluster was busy, still run within the hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2             # retry a couple of times on transient API/DB errors
      activeDeadlineSeconds: 1800 # kill a stuck run after 30 min
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: seo-scrape
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "fetch_google_urls.py", "bernard poignant", "500"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets   # provides DATABASE_OVH__* and SEARCHAPI__API_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
---
# Daily X sync: engagement metrics + new replies, then the digest e-mail.
#
# Cost is flat at ~2 API calls per run however many articles exist: metrics for
# every tweet come back in one batched GET /2/tweets, and new replies across
# every conversation come from a single GET /2/users/:id/mentions with
# since_id. See tweets/__init__.py.
#
# Schedule: every day at 07:30 Europe/Paris — before Bernard's morning, and
# late enough that replies from the previous evening are all in.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-x-poll
  namespace: default
spec:
  schedule: "30 7 * * *"          # daily 07:30
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid       # never let two syncs overlap the cursor
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2             # transient 5xx / network blips
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: x-poll
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "poll_x.py"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets   # DATABASE_OVH__*, BPOIGNANT_X__*, SENDGRID__API_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
---
# Automatic daily share: post the oldest article never put on X.
#
# Posts at most one article per run, and only when nothing has gone out in the
# last 23 hours — so a manual share during the evening suppresses it, and the
# backlog drips out instead of arriving as a burst. No-op once every published
# article has been shared. See tweets.auto_post().
#
# Schedule: every day at 09:30 Europe/Paris — the morning press-review slot,
# when a politically-engaged French audience is actually reading. Midnight (the
# first version of this job) is about the worst available hour. Europe/Paris
# rather than UTC so the slot stays at 09:30 local across the CET/CEST switch.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-x-autopost
  namespace: default
spec:
  schedule: "30 9 * * *"          # daily 09:30
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid       # two overlapping runs could double-post
  # No startingDeadlineSeconds: if the cluster was busy at 09:30 we would
  # rather skip the day than fire a public post at an unexpected hour.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0             # never retry a post — a retry after a
                                  # partial failure risks tweeting twice
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: x-autopost
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "auto_tweet.py"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets   # DATABASE_OVH__*, BPOIGNANT_X__*
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
---
# Daily check that the Google Drive refresh token still works.
#
# Google revokes refresh tokens on password change, on withdrawn access, and
# after seven days while the OAuth consent screen is in "Testing" publishing
# status. Checking here means the admin is told the morning it breaks instead
# of discovering it mid-article, and the alert e-mail goes out once per outage.
#
# Schedule: every day at 07:00 Europe/Paris — before the working day, and
# before the X jobs so an alert is not buried under other mail.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-gdrive-check
  namespace: default
spec:
  schedule: "0 7 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry: the alert is already sent on the first failure, and a retry
      # would only re-test a token that is not going to fix itself.
      backoffLimit: 0
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: gdrive-check
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "check_gdrive.py"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
---
# Nightly TikTok refresh.
#
# The admin's "Récupérer les posts" button only refreshes posts published in
# the last week, so publishing a clip and clicking refresh does not rewrite the
# figures of the whole back catalogue. This job is the other half: once a day
# it refreshes every post, so the older ones stay current without being pulled
# on every click.
#
# Schedule: every day at 00:00 Europe/Paris — TikTok's own counters settle
# overnight, and nothing else runs at that hour.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bpoignant-tiktok-scrape
  namespace: default
spec:
  schedule: "0 0 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One retry: an Apify run can fail on a transient timeout, and unlike the
      # alert jobs a second attempt here is harmless — the upsert is idempotent.
      backoffLimit: 1
      # An actor run over the profile takes minutes, not seconds.
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ovh-registry-secret
          containers:
            - name: tiktok-scrape
              image: 8ie06lx5.c1.gra9.container-registry.ovh.net/reachagent/bpoignant:latest
              imagePullPolicy: Always
              command: ["python", "tiktok_scrape.py"]
              envFrom:
                - secretRef:
                    name: bpoignant-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "500m"
                  memory: 512Mi
