<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rose">
  <rect width="64" height="64" rx="12" fill="#E6003E"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- stem -->
    <path d="M30 37 C 31 45, 33 50, 35 56"/>
    <!-- rose bloom: outer outline -->
    <circle cx="30" cy="24" r="13"/>
    <!-- inner spiral that reads as rose petals -->
    <path d="M24 24 c0 -7 13 -7 13 1 c0 6 -10 7 -12 1 c-1 -4 5 -7 8 -4"/>
  </g>
  <!-- leaf -->
  <path d="M33 46 C 26 43, 18 45, 16 51 C 24 53, 31 51, 33 46 Z" fill="#ffffff"/>
</svg>
