{% extends 'base.html' %}
{% block title %}Connexion admin{% endblock %}

{% block content %}
<section style="background: linear-gradient(135deg, var(--noir), #16213E); padding: 3rem 2rem 1rem; text-align: center; color: white;">
    <h1 style="font-size: 2rem; font-weight: 800;">Espace <span style="color: var(--rouge);">administration</span></h1>
    <p style="color: rgba(255,255,255,0.7); margin-top: 0.5rem;">Connectez-vous pour gérer le contenu du site.</p>
</section>

<div class="form-container">
    <h2>Connexion</h2>
    <p class="form-sub">Réservé aux administrateurs.</p>

    <form method="POST">
        <div class="form-group">
            <label for="username"><i class="fas fa-user"></i> Nom d'utilisateur</label>
            <input type="text" id="username" name="username" required autofocus
                   placeholder="admin" value="{{ username or '' }}">
        </div>
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
    </form>
</div>
{% endblock %}
