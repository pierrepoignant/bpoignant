{% extends 'base.html' %}
{% block title %}Nouvel utilisateur{% endblock %}

{% block content %}
<section style="background: linear-gradient(135deg, var(--noir), #16213E); padding: 3rem 2rem; text-align: center; color: white;">
    <a href="{{ url_for('auth.list_users') }}" class="back-link"><i class="fas fa-arrow-left"></i> Retour aux utilisateurs</a>
    <h1 style="font-size: 2rem; font-weight: 800;"><i class="fas fa-user-plus" style="color: var(--vert);"></i> Nouvel utilisateur</h1>
</section>

<div class="form-container">
    <form method="POST">
        <div class="form-group">
            <label for="username"><i class="fas fa-user"></i> Nom d'utilisateur</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="is_admin" name="is_admin" style="width: auto;">
            <label for="is_admin" style="margin: 0;">Administrateur</label>
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Créer l'utilisateur
        </button>
    </form>
</div>
{% endblock %}
