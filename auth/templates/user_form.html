{% extends 'admin_base.html' %}
{% block title %}Nouvel utilisateur{% endblock %}

{% block admin_title %}<i class="fas fa-user-plus" style="color: var(--vert);"></i> Nouvel utilisateur{% endblock %}

{% block admin_content %}
<div class="form-container" style="margin: 0; padding: 0; box-shadow: none; background: transparent;">
    <form method="POST">
        <div class="form-group">
            <label for="username"><i class="fas fa-user"></i> Nom d'utilisateur</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="email"><i class="far fa-envelope"></i> E-mail (facultatif)</label>
            <input type="email" id="email" name="email" placeholder="utilisé pour les alertes de modération">
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="is_admin" name="is_admin" style="width: auto;">
            <label for="is_admin" style="margin: 0;">Administrateur</label>
        </div>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i> Créer l'utilisateur
        </button>
    </form>
</div>
{% endblock %}
