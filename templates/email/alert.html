<div style="font-family: Georgia, 'Times New Roman', serif; max-width: 540px; margin: 0 auto; color: #1a1a2e;">
  <h2 style="font-size: 1.2rem; margin: 0 0 1rem;">{{ sujet }}</h2>
  <p style="font-size: 1rem; line-height: 1.6; white-space: pre-line;">{{ message }}</p>
  <p style="margin: 1.5rem 0;">
    <a href="{{ action_url }}" style="display: inline-block; background: #E6003E; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 0.95rem;">{{ action_label }}</a>
  </p>
  <p style="font-size: 0.8rem; color: #888; border-top: 1px solid #eee; padding-top: 0.8rem;">
    {{ site_name }} — alerte automatique. Vous recevez ce message une seule fois par incident.
  </p>
</div>
