{# Envoi de La Minute : un test d'abord, puis l'envoi réel. Le test est la
   seule façon de voir l'e-mail tel qu'il arrivera, donc il est dans la même
   fenêtre que le bouton qui l'envoie à tout le monde. #}
<div id="envoi-minute" role="dialog" aria-modal="true" aria-labelledby="minute-titre"
     style="display: none; position: fixed; inset: 0; z-index: 120; background: rgba(26,26,46,0.55); padding: 5vh 1rem; overflow-y: auto;">
    <div style="max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); padding: 1.5rem 1.7rem;">
        <div style="display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.4rem;">
            <h2 id="minute-titre" style="font-size: 1.15rem; margin: 0; flex: 1;">
                <i class="far fa-envelope" style="color: var(--rouge);"></i> Envoyer dans La Minute
            </h2>
            <button type="button" class="btn btn-sm btn-outline" style="color: var(--noir); border-color: #e0e0e0;"
                    onclick="fermerMinute()">Fermer</button>
        </div>
        <p id="minute-clip" style="font-size: 0.9rem; color: var(--gris); margin: 0 0 1.2rem;"></p>

        <label style="display:block; font-size:0.72rem; color:var(--gris); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:0.25rem;">
            Petit mot <span style="text-transform:none; letter-spacing:0;">— facultatif, en tête de l'e-mail</span>
        </label>
        <textarea id="minute-intro" rows="3" form="minute-form-envoi" name="intro"
                  placeholder="Deux lignes d'introduction, si vous le souhaitez."
                  style="width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-family: inherit; font-size: 0.92rem; line-height: 1.55; margin-bottom: 1.1rem;"></textarea>

        <div style="border-top: 1px solid var(--gris-clair); padding-top: 1.1rem;">
            <form method="POST" id="minute-form-test" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.1rem;">
                <input type="hidden" name="intro" id="minute-intro-test">
                <input type="email" name="email" value="{{ mon_email }}" placeholder="votre adresse"
                       style="flex: 1; min-width: 210px; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-family: inherit; font-size: 0.88rem;">
                <button type="submit" class="btn btn-sm btn-outline" style="color: var(--noir); border-color: #e0e0e0;"
                        onclick="document.getElementById('minute-intro-test').value = document.getElementById('minute-intro').value;">
                    <i class="far fa-paper-plane"></i> M'envoyer un test
                </button>
            </form>

            <form method="POST" id="minute-form-envoi"
                  onsubmit="return confirm('Envoyer ce clip aux {{ minute_count }} abonnés de La Minute ? C\'est définitif.')">
                <button type="submit" class="btn btn-sm btn-vert">
                    <i class="fas fa-paper-plane"></i> Envoyer aux {{ minute_count }} abonnés
                </button>
                <span style="font-size: 0.82rem; color: var(--gris); margin-left: 0.6rem;">
                    Un envoi ne peut pas être annulé.
                </span>
            </form>
        </div>
    </div>
</div>

<script>
    // Les adresses viennent du gabarit, portées par des attributs data- :
    // les recomposer ici en collant des morceaux de chemin casserait au
    // premier changement de préfixe.
    function ouvrirMinute(titre, urlTest, urlEnvoi) {
        document.getElementById('minute-clip').textContent = titre;
        document.getElementById('minute-form-test').action = urlTest;
        document.getElementById('minute-form-envoi').action = urlEnvoi;
        document.getElementById('envoi-minute').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    document.querySelectorAll('.bouton-minute').forEach(function (b) {
        b.addEventListener('click', function () {
            ouvrirMinute(b.dataset.titre, b.dataset.test, b.dataset.envoi);
        });
    });
    function fermerMinute() {
        document.getElementById('envoi-minute').style.display = 'none';
        document.body.style.overflow = '';
    }
    document.getElementById('envoi-minute').addEventListener('click', function (e) {
        if (e.target === this) fermerMinute();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') fermerMinute();
    });
</script>
